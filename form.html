<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review Form</title>
    <meta name="description" content="This Product Review Form allows users to evaluate products by selecting a product, rating its performance, choosing useful features, and providing written feedback. The form demonstrates responsive web design, accessibility, JavaScript functionality, and localStorage usage to track and count submitted reviews for the WDD 131 assignment.">
    <meta name="author" content="Lévi Tshipamba">
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>

<body>
    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form action="review.html" method="get">

            <!-- Product Name -->
            <div class="form-group">

                <label for="productName">Product Name</label>

                <select id="productName" name="productName" required>
                    <option value="" selected disabled>Select a Product...</option>
                </select>

            </div>

            <!-- Overall Rating -->
            <div class="form-group">
                <p>Overall Rating</p>
                <div class="rating-container">

                    <div>
                        <label for="rating1">&star;</label>
                        <input type="radio" id="rating1" name="rating" value="1" required>
                    </div>

                    <div>
                        <label for="rating2">&star;&star;</label>
                        <input type="radio" id="rating2" name="rating" value="2" required>
                    </div>

                    <div>
                        <label for="rating3">&star;&star;&star;</label>
                        <input type="radio" id="rating3" name="rating" value="3" required>
                    </div>

                    <div>
                        <label for="rating4">&star;&star;&star;&star;</label>
                        <input type="radio" id="rating4" name="rating" value="4" required>
                    </div>

                    <div>
                        <label for="rating5">&star;&star;&star;&star;&star;</label>
                        <input type="radio" id="rating5" name="rating" value="5" required>
                    </div>

                </div>

            </div>

            <!-- Date -->
            <div class="form-group">
                <label for="installDate">Date of Installation </label>
                <input type="date" id="installDate" name="installDate" required>
            </div>

            <!-- Features -->
            <div class="form-group">

                <p> Which features did you find useful in the product? <br> <em>(Check all that apply)</em></p>

                <div class="checkbox-group">
                    <div>
                        <input type="checkbox" id="durability" name="features" value="durability">
                        <label for="durability">Durability</label>
                    </div>

                    <div>
                        <input  type="checkbox"  id="easeOfUse"  name="features"  value="easeOfUse">
                        <label for="easeOfUse">Ease of Use</label>
                    </div>

                    <div>
                        <input type="checkbox" id="performance" name="features" value="performance">
                        <label for="performance">Performance</label>
                    </div>

                    <div>
                        <input type="checkbox" id="design" name="features" value="design">
                        <label for="design">Design</label>
                    </div>

                </div>

            </div>

            <!-- Review -->
            <div class="form-group">
                <label for="review"> Written Review <span>(Optional)</span>
                </label>
                <textarea id="review"  name="review" rows="6"></textarea>

            </div>

            <!-- User Name -->
            <div class="form-group">

                <label for="userName">Your Name<span>(Optional)</span>
                </label>
                <input type="text" id="userName" name="userName">
            </div>

            <!-- Submit -->
            <div class="form-group">
                <input type="submit" value="Post Review" class="submit-btn">
            </div>

        </form>

    </main>

    <footer>

        <p>
            &copy;<span id="currentyear"></span>
            Lévi Tshipamba  RD Congo😍
        </p>

        <p id="lastModified"></p>

    </footer>

</body>
</html>
