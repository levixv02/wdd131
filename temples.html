<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Explore a picture album featuring beautiful temples from around the world, created as part of the WDD 131 Dynamic Web Fundamentals course.">

    <title>Temple Album | WDD 131</title>
    <link rel="stylesheet" href="styles/temples.css">

    <header>
        <p>Temple Album</p>
        <nav>

            </figure>
